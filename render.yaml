# ── Render Blueprint ─────────────────────────────────────────────────────────
# Ao conectar o repositório no Render, este arquivo configura tudo
# automaticamente: web service + banco PostgreSQL.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: jccolchao-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jccolchao-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: UPLOAD_FOLDER
        value: /tmp/uploads

databases:
  - name: jccolchao-db
    plan: free
    databaseName: jccolchao
    postgresMajorVersion: "16"
